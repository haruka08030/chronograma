name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# 同じブランチへ続けて push したら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # 単体テスト（node）と部品のテスト（jsdom）
      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 画面を通しで動かすテスト（dev サーバーを起こし、Supabase なしの端末保存で動かす）
      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build
