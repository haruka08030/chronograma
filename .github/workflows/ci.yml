name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# 同じブランチへ続けて push したら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 書式・lint・ビルド（どれも速いので 1 つにまとめる）
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ESLint の結果のキャッシュ。型を見るルールがあるので、別のファイルを変えただけで結果が変わることがある。
      # そのため PR では dev / main で全部 lint した結果を読むだけにし、dev / main への push はキャッシュなしで全部見てから保存する
      - name: Restore ESLint cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('package-lock.json', 'eslint.config.js', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('package-lock.json', 'eslint.config.js', 'tsconfig*.json') }}-

      - name: Lint
        run: npx eslint . --cache --cache-strategy content --cache-location .eslintcache

      - name: Save ESLint cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('package-lock.json', 'eslint.config.js', 'tsconfig*.json') }}-${{ github.sha }}

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

  # 単体テスト（node）と部品のテスト（jsdom）。ファイルを 2 つに分けて同時に流す
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test (${{ matrix.shard }}/2)
        run: npx vitest run --shard=${{ matrix.shard }}/2

  # 画面を通しで動かすテスト（dev サーバーを起こし、Supabase なしの端末保存で動かす）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium 本体は Playwright の版ごとにキャッシュする（OS のライブラリは毎回入れる）
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # 前の 1 つのジョブと同じ名前で、上の 3 つが全部通ったかをまとめる（必須のチェックを check のままにしておける）。
  # 前のジョブが落ちたときに「スキップ」で通ってしまわないよう、always() で必ず動かして結果を見る
  check:
    if: always()
    needs: [static, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: test "${{ needs.static.result }}" = success && test "${{ needs.test.result }}" = success && test "${{ needs.e2e.result }}" = success

  # Edge Function の型チェック（Supabase の実行環境と同じ Deno で、npm: / https: の import も解決する）
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 設定は supabase/functions/deno.json（node_modules は使わず、npm: の依存は Deno のキャッシュに取る。ルートの package.json は読まない）。
      # 依存の版は supabase/functions/deno.lock のとおり（--frozen: 合わなければ落とす）
      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.json --frozen supabase/functions/*/index.ts

  # 本物の Postgres（Supabase のローカルの DB）に migration を流し、RLS とトリガーを pgTAP で確かめる
  database:
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # DB だけ起こす。起こすときに supabase/migrations を 001 から番号順に流す
      - name: Start database and apply migrations
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Check every migration was applied
        run: |
          files=$(ls supabase/migrations/[0-9][0-9][0-9]_*.sql | wc -l)
          applied=$(psql "$DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations")
          echo "files=$files applied=$applied"
          test "$files" -eq "$applied"

      # 本番と同じく pg_cron を有効にしてから、全部をもう一度流す（何度流しても同じ形になること・010 のジョブ）
      - name: Apply every migration again (idempotent)
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pg_cron"
          for f in supabase/migrations/[0-9][0-9][0-9]_*.sql; do
            echo "== $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # 010 をもう一度流しても、ジョブは 1 つのまま（同じ名前で置き換わる）。ジョブの文がそのまま動くこと
      - name: Check the tombstone purge job
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/010_sync_tombstone_limits.sql
          test "$(psql "$DB_URL" -tAc "select count(*) from cron.job where jobname = 'purge-sync-tombstones'")" -eq 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin execute (select command from cron.job where jobname = 'purge-sync-tombstones'); end \$\$"

      # supabase/tests/*.sql（pgTAP）
      - name: Database tests
        run: supabase test db
