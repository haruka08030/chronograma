name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# 同じブランチへ続けて push したら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lint は既存の指摘が残っているので、落ちても後続を走らせて全体を一度で見る
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::error::npm run lint が失敗しました（上の Lint ステップのログを参照）"
          exit 1
