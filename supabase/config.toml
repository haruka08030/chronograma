# Minimal Supabase CLI config for Edge Functions deploy
project_id = "chronograma"

[api]
enabled = true

[functions.google-calendar]
verify_jwt = true

# cron（pg_cron + pg_net）から CRON_SECRET ヘッダー付きで呼ぶ。利用者の JWT は無い
[functions.daily-reminders]
verify_jwt = false

[functions.notion]
verify_jwt = true

[functions.account]
verify_jwt = true
